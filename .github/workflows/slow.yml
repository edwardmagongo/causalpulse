name: Slow tier

# The slow tests that need no services and no model API. Too long for every
# push, so they run monthly and by hand, split by test file into three shards
# that each fit well inside a job's time limit. One run costs about 180
# runner-minutes of the repository's allowance, nearly all of it in the shard
# that holds the hierarchical recovery tests: measured on 2026-10-29 that file
# alone took 1h58m, of which 7,035s was one test's setup, building the five
# module-scoped MCMC fixtures it compares. No split can finish sooner than
# that file, so the shards exist to keep the rest of the tier beside it rather
# than to divide it. Eight shards cost 215 runner-minutes for the same wall
# clock, five of them doing under seven minutes of work each.
on:
  schedule:
    # The first of each month at 03:00 UTC.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: Slow tier (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # One shard's failure must not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # One test worker for each CPU the runner has: four, as the runners
      # reported on 2026-10-29. The Makefile's own default is four too.
      - run: make test-slow SHARD=${{ matrix.shard }}/3 SLOW_WORKERS="$(nproc)"
      # Kept whether the shard passed or failed: its per-test durations are how
      # the slow tier's cost is known.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slow-junit-${{ matrix.shard }}-of-3
          path: slow-${{ matrix.shard }}-of-3.xml
          retention-days: 30
          if-no-files-found: warn

  # A scheduled run in which any shard did not succeed opens an issue naming those
  # shards, so it cannot pass unseen. A shard over its time limit is cancelled,
  # not failed, which is why this tests the result and not `failure()`. A run
  # started by hand has someone watching it and opens none.
  report:
    name: Report a failed scheduled run
    needs: slow
    if: always() && github.event_name == 'schedule' && needs.slow.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To list the run's jobs, and to open the issue.
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shards=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name != "Report a failed scheduled run" and .conclusion != "success") | "- \(.name): \(.conclusion)"')
          gh issue create \
            --title "Slow tier failed on $(date -u +%F)" \
            --body "The scheduled slow tier did not succeed. The run, with each shard's log and JUnit report: $RUN_URL

          $shards"
