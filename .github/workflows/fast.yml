name: Fast suite

# The fast Python suite, `make test-fast`, as four shards that run at once,
# split by test file (`make test-fast SHARD=I/4`). Measured locally on
# 2026-10-14, summing each test's duration, the suite is about 63 minutes of
# test time and the largest shard about 19 of them (the panel and donor
# recovery files, 12 and 9 minutes, fall in shards 1 and 4), so a pull request
# waits for its slowest shard, not for the whole suite. On a hosted runner the
# four shards of pull request #8 took 3m0s, 7m43s, 8m56s and 15m26s on
# 2026-11-17, the first wall-clock measurement of them. Each shard repeats the
# checkout and `uv sync`, so the four cost a little more runner time than one
# job did; the suite is still most of what a pull request costs.
#
# It runs on every pull request and on every push to `main`. Until 2026-11-17
# a path filter held it back on a pull request that touched nothing the suite
# reads, to spend fewer of the Actions minutes a private repository is billed
# for. The repository has been public since 2026-11-01 and a run of it costs
# no minutes, while the filter had a price that outlived its saving: a
# required check a filter skips never reports, and a pull request waiting for
# one waits for ever, so none of the four shards could be a required check.
# All four are required on `main` now, and nothing filters them.
#
# `deploy.yml` reads this workflow's run by its name, "Fast suite"; a run
# succeeds only when all four shards do.
on:
  push:
    branches: [main]
  pull_request:

# As in `ci.yml`. On `main` a waiting run can be replaced by a later push, so
# the latest tree always has a result and an intermediate commit may not.
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    name: Fast suite (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # Hosted runners differ by more than a factor of two on this suite: the
    # whole of it has taken 17, 35 and over 60 minutes on one job. A shard is
    # about a third of the slowest of those; the limit leaves room for a slow
    # runner.
    timeout-minutes: 60
    strategy:
      # One shard's failure must not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Which machine this is, so that a slow run can be told from a slow suite.
      - run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread' ; nproc
      - run: uv sync --frozen
      # One test worker for each CPU the runner has: four, as the runners
      # reported on 2026-10-29. More workers than CPUs only contend.
      - run: make test-fast SHARD=${{ matrix.shard }}/4 WORKERS="$(nproc)"
