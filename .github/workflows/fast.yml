name: Fast suite

# The fast Python suite, `make test-fast`, as four shards that run at once,
# split by test file (`make test-fast SHARD=I/4`). Measured locally on
# 2026-10-14, summing each test's duration, the suite is about 63 minutes of
# test time and the largest shard about 19 of them (the panel and donor
# recovery files, 12 and 9 minutes, fall in shards 1 and 4), so a pull request
# waits for its slowest shard, not for the whole suite. Wall-clock time per
# shard on a hosted runner has not been measured yet. Each shard repeats the checkout and `uv sync`, so the four
# cost a little more runner time than one job did; the suite is still most of
# what a pull request costs. The repository is private
# and its Actions minutes are counted, so this runs on a pull request only
# when something the suite tests has changed, and on every push to `main`,
# where it is the net under whatever a path filter let through.
#
# The paths are what the suite reads: the packages and tests, the dependency
# and tool pins, and the committed files some tests check against (the
# OpenAPI document, the study bundle, the published reports) or parse (the
# import contracts, the `Dockerfile`, every compose file at the root, the
# Makefile). GitHub looks at the first 300 changed files only; the push to
# `main` is the net under that too.
#
# If branch protection is ever enforced again, none of the "Fast suite (shard
# I of 4)" checks may be required as they stand: a pull request this filter
# skips would wait for them for ever. `deploy.yml` reads this workflow's run
# by its name, "Fast suite"; a run succeeds only when all four shards do.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Makefile"
      - "Dockerfile"
      # Both spellings: `tests/api/test_settings.py` reads both.
      - "docker-compose*.yml"
      - "docker-compose*.yaml"
      - ".importlinter"
      - "web/openapi.json"
      - "web/src/data/**"
      - "docs/reports/**"
      - ".github/workflows/fast.yml"

# As in `ci.yml`. On `main` a waiting run can be replaced by a later push, so
# the latest tree always has a result and an intermediate commit may not.
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    name: Fast suite (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # Hosted runners differ by more than a factor of two on this suite: the
    # whole of it has taken 17, 35 and over 60 minutes on one job. A shard is
    # about a third of the slowest of those; the limit leaves room for a slow
    # runner.
    timeout-minutes: 60
    strategy:
      # One shard's failure must not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Which machine this is, so that a slow run can be told from a slow suite.
      - run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread' ; nproc
      - run: uv sync --frozen
      # One test worker for each CPU the runner has: four, as the runners
      # reported on 2026-10-29. More workers than CPUs only contend.
      - run: make test-fast SHARD=${{ matrix.shard }}/4 WORKERS="$(nproc)"
