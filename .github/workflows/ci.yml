name: CI

# Five of the gates a developer runs with `make`, one job each: the quick
# ones, about ten billed runner-minutes together. A sixth job, `production`,
# runs `make smoke-prod` on pushes to `main` only. Every job is set-up followed
# by one `make` invocation: nothing a gate does is written again here.
#
# Two more gates have workflows of their own, because a workflow can be
# limited to the paths a change touches and a job cannot. The fast Python
# suite (`fast.yml`, four shards at once) runs on a pull request only when
# something it tests has changed. `make check-infra` (`infra.yml`) runs only
# when the change touches the Terraform, the deploy files, a workflow or one
# of the few other files that gate reads.
#
# Pushes run for `main` only; every other branch is covered by its pull
# request. That is what makes a push to a branch with an open pull request run
# these jobs once, not twice. A branch with no pull request has no run.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
# On `main` a run in progress is never cancelled, though a third push while
# one runs and one waits replaces the waiting one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: make lint types imports

  services:
    name: Services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: make check-services

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Makes `pnpm` the version `web/package.json` names in `packageManager`.
      - run: corepack enable
      - run: make check-web

  # Builds both images with `docker compose`; needs no registry login and no
  # Python on the runner.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Makes `pnpm` the version `web/package.json` names in `packageManager`.
      - run: corepack enable
      - run: make smoke-web PLAYWRIGHT_INSTALL=--with-deps
      # Playwright keeps a trace of each failed test here.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the Python image with `docker compose`; needs no registry login.
  stack:
    name: Stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: make smoke

  # The production stack behind its proxy, over HTTPS: builds both images with
  # `docker compose`, and needs no registry login and no Python on the runner.
  # The secrets it starts the stack with are generated by the recipe with the
  # runner's `openssl`; it reads none of the repository's.
  #
  # On pushes to `main` only, and not on pull requests. The repository is
  # private and its Actions minutes are counted: this job builds the images
  # the Browser job has already built and runs that job's browser tests a
  # second time before its own, so on every push to a pull request it would
  # roughly double what the Browser job costs. A pull request that changes the
  # production stack is checked with `make smoke-prod` on a developer's
  # machine before it is merged, and by this job once it is.
  production:
    name: Production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Makes `pnpm` the version `web/package.json` names in `packageManager`.
      - run: corepack enable
      - run: make smoke-prod PLAYWRIGHT_INSTALL=--with-deps
      # Playwright keeps a trace of each failed test here, the gate's two runs
      # apart. Its own name: two jobs of one run cannot upload artifacts under
      # the same one.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-production
          path: |
            web/test-results/workflow/
            web/test-results/production/
          retention-days: 7
          if-no-files-found: ignore
