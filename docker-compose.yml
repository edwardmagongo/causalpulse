# Local demo stack. The credentials are local-only test values, not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: causalpulse
      POSTGRES_PASSWORD: causalpulse
      POSTGRES_DB: causalpulse
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causalpulse"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
