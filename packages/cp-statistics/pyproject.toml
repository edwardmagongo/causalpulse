[project]
name = "cp-statistics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "numpy>=2.0", "scipy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_statistics"]

[tool.uv.sources]
cp-core = { workspace = true }
