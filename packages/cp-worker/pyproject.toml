[project]
name = "cp-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-report", "cp-api", "rq>=2.0", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_worker"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-report = { workspace = true }
cp-api = { workspace = true }
