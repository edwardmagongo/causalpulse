[project]
name = "cp-figures"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "numpy>=2.0", "pandas>=2.2", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_figures"]

[tool.uv.sources]
cp-core = { workspace = true }
