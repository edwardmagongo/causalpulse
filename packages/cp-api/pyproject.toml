[project]
name = "cp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cp-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "rq>=2.0",
    "redis>=5.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
cp-api-migrate = "cp_api.migrate:main"
cp-api-admin = "cp_api.admin:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_api"]

[tool.uv.sources]
cp-core = { workspace = true }
