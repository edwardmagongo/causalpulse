[project]
name = "cp-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-causal", "cp-report", "pydantic>=2.7", "anthropic>=1.11,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_llm"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-causal = { workspace = true }
cp-report = { workspace = true }
