[project]
name = "cp-llm-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cp-core",
    "cp-simulation",
    "cp-report",
    "cp-llm",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "anthropic>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_llm_eval"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-simulation = { workspace = true }
cp-report = { workspace = true }
cp-llm = { workspace = true }
