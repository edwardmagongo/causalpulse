[project]
name = "cp-report"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-figures", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_report"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-figures = { workspace = true }
