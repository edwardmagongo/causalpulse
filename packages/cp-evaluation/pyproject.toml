[project]
name = "cp-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-statistics", "cp-simulation", "cp-causal", "numpy>=2.0", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_evaluation"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-statistics = { workspace = true }
cp-simulation = { workspace = true }
cp-causal = { workspace = true }
