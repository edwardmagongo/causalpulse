[project]
name = "cp-causal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cp-core",
    "cp-statistics",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "numpyro>=0.15",
    "jax>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_causal"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-statistics = { workspace = true }
