[project]
name = "cp-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cp-core",
    "cp-statistics",
    "cp-simulation",
    "cp-causal",
    "cp-evaluation",
    "cp-report",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.scripts]
causalpulse = "cp_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_cli"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-statistics = { workspace = true }
cp-simulation = { workspace = true }
cp-causal = { workspace = true }
cp-evaluation = { workspace = true }
cp-report = { workspace = true }
