[project]
name = "causalpulse"
version = "0.1.0"
description = "Causal inference and experimentation platform"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-statistics", "cp-simulation", "cp-causal", "cp-evaluation", "cp-figures", "cp-report", "cp-cli"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-statistics = { workspace = true }
cp-simulation = { workspace = true }
cp-causal = { workspace = true }
cp-evaluation = { workspace = true }
cp-figures = { workspace = true }
cp-report = { workspace = true }
cp-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "econml>=0.17.0",
    "pandas-stubs>=3.0.5.260730",
    "pysyncon>=1.5",
    "scipy-stubs>=1.18.0.1",
    "statsmodels>=0.14",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Broader than the name's original scope, and worth stating accurately:
    # this marker now carries three kinds of cost -- reference parity against
    # external libraries, measured-rate protocols that need many seeds to mean
    # anything, and assertions that need a real MCMC posterior rather than a
    # shape-exercising one. What they share is that no cheaper version tests
    # the same claim, so they are excluded rather than weakened.
    #
    # Excluded by `make test-fast` only. `make test` and `make check` still run
    # them, which is deliberate: the full gate should not have a blind spot.
    "slow: reference parity, measured-rate protocols, and MCMC-cost tests; skipped by test-fast",
]
# Warnings are failures. A numpy overflow in a hand-rolled sigmoid reached the
# suite silently once and was only caught by running with -W error; the standard
# the project is verified against belongs in the repository, not in habit.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# `X` is the design matrix in standard econometric notation; lowercasing it
# makes the matrix algebra harder to read against textbook formulas. pep8-naming
# stays enforced everywhere else in the workspace.
"packages/cp-statistics/src/cp_statistics/covariance.py" = ["N803", "N806"]
"tests/statistics/test_covariance.py" = ["N803", "N806"]
"packages/cp-statistics/src/cp_statistics/linalg_safety.py" = ["N803"]
"tests/statistics/test_linalg_safety.py" = ["N803", "N806"]
# `A`/`M` mirror standard linear-algebra notation for a matrix and its
# generator, same reasoning as the `X`/`y` exemptions above.
"tests/causal/test_panel_checks.py" = ["N803", "N806"]
# `T_pre` mirrors the BSTS design doc's notation for the pre-period length;
# lowercasing it would fight every reference to the same symbol there.
"packages/cp-causal/src/cp_causal/estimators/bsts.py" = ["N803"]
# `X`/`Y_res`/`W_res` mirror the R-learner design doc's notation for the
# covariate matrix and residualized outcome/treatment; lowercasing them
# would fight every reference to the same symbols there.
"tests/causal/test_causal_forest.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker as of 1.9; this is a targeted
# exception rather than a blanket ignore_missing_imports so untyped imports
# elsewhere still fail loudly.
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpyro ships no py.typed marker as of 0.21; jax does and needs no override.
# Targeted, not blanket ignore_missing_imports, so other untyped imports still
# fail loudly.
module = "numpyro.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]
