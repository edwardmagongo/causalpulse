[project]
name = "causalpulse"
version = "0.1.0"
description = "Causal inference and experimentation platform"
requires-python = ">=3.12"
dependencies = ["cp-core", "cp-statistics", "cp-simulation"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cp-core = { workspace = true }
cp-statistics = { workspace = true }
cp-simulation = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reference-parity tests against external libraries; run nightly",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
